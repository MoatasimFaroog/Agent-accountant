<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Upload - AI Bookkeeper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 40px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #f0f4ff;
            border-color: #764ba2;
        }
        
        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .file-input {
            display: none;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: auto;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .result h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .result-data {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
        }
        
        .result-data pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .selected-file {
            margin-top: 15px;
            padding: 12px;
            background: #f8f9ff;
            border-radius: 6px;
            display: none;
        }
        
        .selected-file.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 AI Invoice Processor</h1>
            <p>Upload invoice images for automatic OCR processing and Odoo integration</p>
        </div>
        
        <div class="content">
            <form id="uploadForm">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <h3>Click or drag invoice image here</h3>
                    <p style="margin-top: 10px; color: #666;">Supported: PNG, JPG, JPEG, PDF, TIFF, BMP (Max 16MB)</p>
                    <input type="file" id="fileInput" class="file-input" accept=".png,.jpg,.jpeg,.pdf,.tiff,.bmp" required>
                </div>
                
                <div class="selected-file" id="selectedFile">
                    <strong>Selected file:</strong> <span id="fileName"></span>
                </div>
                
                <div class="form-group">
                    <label for="partnerId">Partner/Vendor ID (Optional)</label>
                    <input type="number" id="partnerId" placeholder="Enter Odoo partner ID">
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="autoCreate" checked>
                    <label for="autoCreate" style="margin-bottom: 0;">Automatically create invoice in Odoo</label>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">Process Invoice</button>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing invoice... This may take a few seconds.</p>
            </div>
            
            <div class="result" id="result">
                <h3 id="resultTitle"></h3>
                <div class="result-data">
                    <pre id="resultContent"></pre>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadForm = document.getElementById('uploadForm');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');
        const selectedFile = document.getElementById('selectedFile');
        const fileName = document.getElementById('fileName');
        
        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // File selected
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileName.textContent = e.target.files[0].name;
                selectedFile.classList.add('show');
            }
        });
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                fileName.textContent = e.dataTransfer.files[0].name;
                selectedFile.classList.add('show');
            }
        });
        
        // Form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = fileInput.files[0];
            if (!file) {
                alert('Please select a file');
                return;
            }
            
            // Prepare form data
            const formData = new FormData();
            formData.append('file', file);
            
            const partnerId = document.getElementById('partnerId').value;
            if (partnerId) {
                formData.append('partner_id', partnerId);
            }
            
            const autoCreate = document.getElementById('autoCreate').checked;
            formData.append('auto_create', autoCreate);
            
            // Show loading
            uploadForm.style.display = 'none';
            loading.style.display = 'block';
            result.style.display = 'none';
            
            try {
                // Call API
                const response = await fetch('http://localhost:5000/upload_invoice', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // Show result
                loading.style.display = 'none';
                result.style.display = 'block';
                
                if (data.success) {
                    result.className = 'result success';
                    document.getElementById('resultTitle').textContent = '✅ Invoice processed successfully!';
                    document.getElementById('resultContent').textContent = JSON.stringify(data, null, 2);
                } else {
                    result.className = 'result error';
                    document.getElementById('resultTitle').textContent = '❌ Error processing invoice';
                    document.getElementById('resultContent').textContent = data.error || 'Unknown error occurred';
                }
            } catch (error) {
                loading.style.display = 'none';
                result.style.display = 'block';
                result.className = 'result error';
                document.getElementById('resultTitle').textContent = '❌ Connection error';
                document.getElementById('resultContent').textContent = 'Could not connect to API server. Make sure the server is running on http://localhost:5000';
            }
            
            // Reset form
            uploadForm.reset();
            selectedFile.classList.remove('show');
            uploadForm.style.display = 'block';
        });
    </script>
</body>
</html>
